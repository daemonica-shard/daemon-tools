name: Build (Unity)

# Reusable workflow — called by a thin wrapper in each game repo.
# Phase-1 scope: GameCI activation + GameBuilder build, output uploaded as an artifact.
# fastlane delivery (TestFlight / Play) is layered on in a later increment.

on:
  workflow_call:
    inputs:
      platform:
        description: 'Android | iOS'
        type: string
        default: Android
      config:
        description: 'Debug | Prod | Release'
        type: string
        default: Debug
      unity-version:
        description: 'Unity version (blank = auto-detect from ProjectVersion.txt)'
        type: string
        default: ''
      project-path:
        description: 'Path to the Unity project within the repo'
        type: string
        default: '.'
      build-version:
        description: 'bundleVersion to stamp (blank = leave whatever the project has)'
        type: string
        default: ''
      gradle-version:
        description: 'Custom Gradle to download + point Unity at, e.g. 8.7 (blank = Unity bundled Gradle)'
        type: string
        default: ''
      jdk-version:
        description: 'JDK major version to download + point Unity at, e.g. 17 (blank = Unity bundled JDK)'
        type: string
        default: ''
      display-name:
        description: 'Human app name for notifications, e.g. "Word Game" (blank = repo name)'
        type: string
        default: ''
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      # Android signing — shared keystore for all configs. Required for Android builds.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false
      ANDROID_KEYALIAS_NAME:
        required: false
      ANDROID_KEYALIAS_PASS:
        required: false
      # Google Drive delivery (rclone). Optional: when unset, the Drive-upload step is skipped,
      # so repos without it configured (e.g. Sway until it's set up) build normally. Holds the
      # contents of a `drive.file`-scoped rclone.conf with a remote named `gdrive`.
      RCLONE_CONFIG:
        required: false
      # Pachca incoming-webhook URL for the #builds chat. Optional: unset → notify step skipped.
      PACHCA_WEBHOOK_URL:
        required: false
      # Pachca incoming-webhook URL for the dev/errors chat — used only to report build failures.
      PACHCA_FAIL_WEBHOOK_URL:
        required: false
      # Telegram bot token + target chat id. Optional: either unset → Telegram notify skipped.
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      # Google Play service-account JSON. Optional: unset → Play upload skipped.
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

jobs:
  build:
    name: ${{ inputs.platform }} ${{ inputs.config }}
    runs-on: ${{ inputs.platform == 'iOS' && 'macos-latest' || 'ubuntu-latest' }}
    # Resolve the secret to a boolean here: `secrets` can't be referenced in a step `if:`, but a
    # plain env flag can. Avoids putting the config contents in an env just to gate the step.
    env:
      HAVE_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
      HAVE_PACHCA: ${{ secrets.PACHCA_WEBHOOK_URL != '' }}
      HAVE_PACHCA_FAIL: ${{ secrets.PACHCA_FAIL_WEBHOOK_URL != '' }}
      HAVE_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
      HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      # The ~25 GB GameCI image + its container layers otherwise live in /var/lib/docker on the
      # 72 GB root disk, competing with the cold build's workspace (Library + IL2CPP) for space.
      # Point Docker's data-root at the spare ~73 GB /mnt disk so the root disk is free for the
      # workspace. Must run before anything pulls the image.
      - name: Move Docker to /mnt
        if: runner.os == 'Linux'
        run: |
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo rm -rf /var/lib/docker
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"

      # GameCI's Unity Docker image is 10-20 GB; ubuntu-latest ships only ~14 GB free.
      # Strip preinstalled host tooling GameCI doesn't need (it builds Android inside its
      # own container) to avoid "no space left on device". The runner VM is disposable.
      - name: Free up disk space
        if: runner.os == 'Linux'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift /usr/local/julia* /opt/microsoft /usr/share/miniconda \
            /opt/az /usr/local/lib/node_modules /usr/local/share/chromium /opt/google/chrome /usr/lib/firefox
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      # ~7.8 GB RAM is tight for a cold IL2CPP + clang; a small swap on /mnt is OOM insurance.
      # Kept at 8 GB (not 16) so Docker, now also on /mnt, has room for the image + container layers.
      - name: Add swap (cold-build OOM guard)
        if: runner.os == 'Linux'
        run: |
          free -h
          sudo fallocate -l 8G /mnt/swapfile2
          sudo chmod 600 /mnt/swapfile2
          sudo mkswap /mnt/swapfile2
          sudo swapon /mnt/swapfile2
          free -h

      - name: Checkout (with TEL submodule + LFS)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true

      # Resolve version + package up front so they're available even when the build fails (no APK
      # to parse on failure). Version mirrors GameBuilder: passed build-version (v stripped), else
      # the project's bundleVersion. Package = Android applicationIdentifier. [[:space:]] keeps sed
      # portable to macOS (iOS runner).
      - name: Resolve version + package
        id: version
        run: |
          f="${{ inputs.project-path }}/ProjectSettings/ProjectSettings.asset"
          v='${{ inputs.build-version }}'
          v="${v#v}"; v="${v#V}"
          if [ -z "$v" ]; then
            v=$(grep -E '^[[:space:]]*bundleVersion:' "$f" 2>/dev/null | head -1 \
                | sed -E 's/.*bundleVersion:[[:space:]]*//' | tr -d '\r' || true)
          fi
          pkg=$(awk '/applicationIdentifier:/{seen=1} seen&&/Android:/{print; exit}' "$f" \
                | sed -E 's/.*Android:[[:space:]]*//' | tr -d '\r' || true)
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v, package: $pkg"

      - name: Restore Library/ cache
        id: cache-library
        uses: actions/cache/restore@v5
        with:
          path: ${{ inputs.project-path }}/Library
          key: Library-${{ inputs.platform }}-${{ hashFiles(format('{0}/Assets/**', inputs.project-path), format('{0}/Packages/**', inputs.project-path), format('{0}/ProjectSettings/**', inputs.project-path)) }}
          restore-keys: |
            Library-${{ inputs.platform }}-
            Library-

      # Opt-in per project: a wrapper that sets `gradle-version` (e.g. WordGame → 8.7) gets that
      # Gradle downloaded into the workspace (GameCI mounts it at /github/workspace) and pointed at
      # by GameBuilder. Wrappers that omit it (e.g. Sway on Unity 6) use Unity's bundled Gradle.
      - name: Provide custom Gradle (Android)
        if: runner.os == 'Linux' && inputs.platform == 'Android' && inputs.gradle-version != ''
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sSL "https://services.gradle.org/distributions/gradle-${{ inputs.gradle-version }}-bin.zip" -o gradle.zip
          unzip -q gradle.zip && rm gradle.zip

      # Same opt-in as Gradle: Unity's bundled JDK (11) is too old for newer AGP (needs 17).
      - name: Provide JDK (Android)
        if: runner.os == 'Linux' && inputs.platform == 'Android' && inputs.jdk-version != ''
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sSL "https://api.adoptium.net/v3/binary/latest/${{ inputs.jdk-version }}/ga/linux/x64/jdk/hotspot/normal/eclipse" -o jdk.tar.gz
          mkdir -p jdk && tar -xzf jdk.tar.gz -C jdk --strip-components=1 && rm jdk.tar.gz

      - name: Build (GameCI)
        id: build
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ inputs.project-path }}
          unityVersion: ${{ inputs.unity-version || 'auto' }}
          targetPlatform: ${{ inputs.platform }}
          allowDirtyBuild: true
          # Own the version ourselves. GameCI's default `Semantic` strategy generates its own
          # version (0.0.<commit-count> when there are no v* tags) and injects `-buildVersion`
          # into Unity's command line BEFORE our customParameters — so GameBuilder's first-match
          # arg parse read GameCI's value and ignored ours. `Custom` makes GameCI forward exactly
          # our build-version as the single -buildVersion (empty when blank → GameBuilder leaves
          # the project's bundleVersion untouched). androidVersionCode is pinned to the run number
          # so GameCI skips parsing the version string for a code (GameBuilder sets the real
          # bundleVersionCode from -buildNumber regardless).
          versioning: Custom
          version: ${{ inputs.build-version }}
          androidVersionCode: ${{ github.run_number }}
          # Android signing: GameCI decodes the keystore + sets env vars; GameBuilder applies them.
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildMethod: TapEmpire.Build.GameBuilder.BuildFromCommandLine
          # -disable-assembly-updater: skip Unity's API Updater, which times out on a cold
          # Library when importing many precompiled DLLs (Odin/Firebase/etc.) on slow CI CPUs.
          customParameters: >-
            -disable-assembly-updater
            -buildConfig ${{ inputs.config }}
            -platform ${{ inputs.platform }}
            -buildNumber ${{ github.run_number }}
            -appName ${{ github.event.repository.name }}
            ${{ inputs.gradle-version != '' && format('-gradleDir /github/workspace/gradle-{0}', inputs.gradle-version) || '' }}
            ${{ inputs.jdk-version != '' && '-jdkPath /github/workspace/jdk' || '' }}

      # GameCI's container writes Library/ as a uid the host runner can't read, so tar fails
      # silently on cache save. Chown to the runner user before saving.
      - name: Fix Library/ ownership for cache save
        if: always() && runner.os == 'Linux'
        run: sudo chown -R $(id -u):$(id -g) "${{ inputs.project-path }}/Library" 2>/dev/null || true

      # The build re-pulled GameCI's ~25 GB Unity image (we pruned it at the start), refilling
      # the disk. Compressing Library/ into cache.tzst needs free space ≈ the archive size, so
      # reclaim the now-unused image before the cache save / artifact upload — else tar dies with
      # "No space left on device".
      - name: Reclaim disk before cache save
        if: always() && runner.os == 'Linux'
        run: |
          echo "Before:"; df -h /
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      # Save Library/ even on failure — it's complete before Gradle, so this warms the next run.
      - name: Save Library/ cache
        if: always() && steps.cache-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ inputs.project-path }}/Library
          key: ${{ steps.cache-library.outputs.cache-primary-key }}

      # Tap-to-install delivery: APKs → anyone-with-link URL in the run summary; Release symbols
      # archived alongside; .aab skipped. drive.file token only ever touches its own AutoBuilds/ tree.
      - name: Upload to Google Drive (rclone)
        id: drive
        if: success() && runner.os == 'Linux' && inputs.platform == 'Android' && env.HAVE_RCLONE == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}   # not RCLONE_CONFIG — that name is rclone's config-path var
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          repo='${{ github.event.repository.name }}'
          builds='${{ inputs.project-path }}/Builds'
          shopt -s nullglob

          for apk in "$builds"/*.apk; do
            name=$(basename "$apk")
            rclone copyto "$apk" "gdrive:AutoBuilds/$repo/apk/$name"
            link=$(rclone link "gdrive:AutoBuilds/$repo/apk/$name")
            # name is <app>-<config>-<version>-build<N>.apk; version has no dashes, so peel it out
            base="${name%.apk}"; rest="${base%-build*}"; version="${rest##*-}"
            echo "apk_link=$link" >> "$GITHUB_OUTPUT"
            echo "apk_version=$version" >> "$GITHUB_OUTPUT"
            echo "📱 **$name** → $link" >> "$GITHUB_STEP_SUMMARY"
          done

          for sym in "$builds"/*.symbols.zip; do
            name=$(basename "$sym")
            rclone copyto "$sym" "gdrive:AutoBuilds/$repo/symbols/$name"
            echo "🧩 symbols archived: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # Publish the Release .aab to Google Play (internal track, rolled out). Release-only, when the
      # service-account secret is present. NOTE: versionCode (= run number) must exceed the highest
      # already on Play or Play rejects the upload — failing this step (red job, no notification).
      - name: Upload to Google Play (internal)
        if: success() && runner.os == 'Linux' && inputs.platform == 'Android' && inputs.config == 'Release' && env.HAVE_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5  # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.version.outputs.package }}
          releaseFiles: ${{ inputs.project-path }}/Builds/*.aab
          track: internal
          status: completed

      - name: Upload build artifact (fallback)
        if: always() && steps.build.outcome == 'success' && steps.drive.outputs.apk_link == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.platform }}-${{ inputs.config }}-${{ github.run_number }}
          path: ${{ inputs.project-path }}/Builds
          if-no-files-found: error

      # Notify the #builds chat (build users) on success, only when there's an installable APK to
      # hand out — so Release (.aab only) and failures stay silent here; build failures go to the
      # separate dev channel via the failure step below.
      - name: Notify Pachca (#builds)
        if: success() && env.HAVE_PACHCA == 'true' && steps.drive.outputs.apk_link != ''
        env:
          PACHCA_WEBHOOK_URL: ${{ secrets.PACHCA_WEBHOOK_URL }}
          APP: ${{ inputs.display-name || github.event.repository.name }}
          CONFIG: ${{ inputs.config }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ steps.drive.outputs.apk_version }}
          LINK: ${{ steps.drive.outputs.apk_link }}
        run: |
          set -euo pipefail
          msg=$(printf '%s\nType: %s\nVersion: %s\nPlatform: %s\nLink: %s' \
            "$APP" "$CONFIG" "$VERSION" "$PLATFORM" "$LINK")
          jq -nc --arg m "$msg" '{message: $m}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$PACHCA_WEBHOOK_URL"

      # Same message/trigger as Pachca, different transport. Independent opt-in: fires only when
      # both the bot token and chat id are set, so one channel works without the other.
      - name: Notify Telegram (builds)
        if: success() && env.HAVE_TELEGRAM == 'true' && steps.drive.outputs.apk_link != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP: ${{ inputs.display-name || github.event.repository.name }}
          CONFIG: ${{ inputs.config }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ steps.drive.outputs.apk_version }}
          LINK: ${{ steps.drive.outputs.apk_link }}
        run: |
          set -euo pipefail
          msg=$(printf '%s\nType: %s\nVersion: %s\nPlatform: %s\nLink: %s' \
            "$APP" "$CONFIG" "$VERSION" "$PLATFORM" "$LINK")
          jq -nc --arg c "$TG_CHAT" --arg t "$msg" \
            '{chat_id: $c, text: $t, disable_web_page_preview: true}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"

      # Report build failures to the dev/errors channel — fires only when the GameCI build step
      # itself failed (not cache/upload hiccups). Version comes from the resolve step, so it's
      # present even though no APK was produced.
      - name: Notify Pachca on failure (dev)
        if: always() && steps.build.outcome == 'failure' && env.HAVE_PACHCA_FAIL == 'true'
        env:
          PACHCA_WEBHOOK_URL: ${{ secrets.PACHCA_FAIL_WEBHOOK_URL }}
          APP: ${{ inputs.display-name || github.event.repository.name }}
          CONFIG: ${{ inputs.config }}
          PLATFORM: ${{ inputs.platform }}
          VERSION: ${{ steps.version.outputs.v }}
        run: |
          set -euo pipefail
          msg=$(printf '%s\nType: %s\nVersion: %s\nPlatform: %s\nFAILED' \
            "$APP" "$CONFIG" "$VERSION" "$PLATFORM")
          jq -nc --arg m "$msg" '{message: $m}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' -d @- "$PACHCA_WEBHOOK_URL"
