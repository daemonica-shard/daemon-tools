name: Build (Unity)

# Reusable workflow — called by a thin wrapper in each game repo.
# Phase-1 scope: GameCI activation + GameBuilder build, output uploaded as an artifact.
# fastlane delivery (TestFlight / Play) is layered on in a later increment.

on:
  workflow_call:
    inputs:
      platform:
        description: 'Android | iOS'
        type: string
        default: Android
      config:
        description: 'Debug | Prod | Release'
        type: string
        default: Debug
      unity-version:
        description: 'Unity version (blank = auto-detect from ProjectVersion.txt)'
        type: string
        default: ''
      project-path:
        description: 'Path to the Unity project within the repo'
        type: string
        default: '.'
      build-version:
        description: 'bundleVersion to stamp (blank = leave whatever the project has)'
        type: string
        default: ''
      gradle-version:
        description: 'Custom Gradle to download + point Unity at, e.g. 8.7 (blank = Unity bundled Gradle)'
        type: string
        default: ''
      jdk-version:
        description: 'JDK major version to download + point Unity at, e.g. 17 (blank = Unity bundled JDK)'
        type: string
        default: ''
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      # Android signing — shared keystore for all configs. Required for Android builds.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false
      ANDROID_KEYALIAS_NAME:
        required: false
      ANDROID_KEYALIAS_PASS:
        required: false

jobs:
  build:
    name: ${{ inputs.platform }} ${{ inputs.config }}
    runs-on: ${{ inputs.platform == 'iOS' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      # GameCI's Unity Docker image is 10-20 GB; ubuntu-latest ships only ~14 GB free.
      # Strip preinstalled host tooling GameCI doesn't need (it builds Android inside its
      # own container) to avoid "no space left on device". The runner VM is disposable.
      - name: Free up disk space
        if: runner.os == 'Linux'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Checkout (with TEL submodule + LFS)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Restore Library/ cache
        id: cache-library
        uses: actions/cache/restore@v5
        with:
          path: ${{ inputs.project-path }}/Library
          key: Library-${{ inputs.platform }}-${{ hashFiles(format('{0}/Assets/**', inputs.project-path), format('{0}/Packages/**', inputs.project-path), format('{0}/ProjectSettings/**', inputs.project-path)) }}
          restore-keys: |
            Library-${{ inputs.platform }}-
            Library-

      # Opt-in per project: a wrapper that sets `gradle-version` (e.g. WordGame → 8.7) gets that
      # Gradle downloaded into the workspace (GameCI mounts it at /github/workspace) and pointed at
      # by GameBuilder. Wrappers that omit it (e.g. Sway on Unity 6) use Unity's bundled Gradle.
      - name: Provide custom Gradle (Android)
        if: runner.os == 'Linux' && inputs.platform == 'Android' && inputs.gradle-version != ''
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sSL "https://services.gradle.org/distributions/gradle-${{ inputs.gradle-version }}-bin.zip" -o gradle.zip
          unzip -q gradle.zip && rm gradle.zip

      # Same opt-in as Gradle: Unity's bundled JDK (11) is too old for newer AGP (needs 17).
      - name: Provide JDK (Android)
        if: runner.os == 'Linux' && inputs.platform == 'Android' && inputs.jdk-version != ''
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sSL "https://api.adoptium.net/v3/binary/latest/${{ inputs.jdk-version }}/ga/linux/x64/jdk/hotspot/normal/eclipse" -o jdk.tar.gz
          mkdir -p jdk && tar -xzf jdk.tar.gz -C jdk --strip-components=1 && rm jdk.tar.gz

      - name: Build (GameCI)
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ inputs.project-path }}
          unityVersion: ${{ inputs.unity-version || 'auto' }}
          targetPlatform: ${{ inputs.platform }}
          allowDirtyBuild: true
          # Android signing: GameCI decodes the keystore + sets env vars; GameBuilder applies them.
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildMethod: TapEmpire.Build.GameBuilder.BuildFromCommandLine
          # -disable-assembly-updater: skip Unity's API Updater, which times out on a cold
          # Library when importing many precompiled DLLs (Odin/Firebase/etc.) on slow CI CPUs.
          customParameters: >-
            -disable-assembly-updater
            -buildConfig ${{ inputs.config }}
            -platform ${{ inputs.platform }}
            -buildNumber ${{ github.run_number }}
            ${{ inputs.gradle-version != '' && format('-gradleDir /github/workspace/gradle-{0}', inputs.gradle-version) || '' }}
            ${{ inputs.jdk-version != '' && '-jdkPath /github/workspace/jdk' || '' }}
            ${{ inputs.build-version != '' && format('-buildVersion {0}', inputs.build-version) || '' }}

      # GameCI's container writes Library/ as a uid the host runner can't read, so tar fails
      # silently on cache save. Chown to the runner user before saving.
      - name: Fix Library/ ownership for cache save
        if: always() && runner.os == 'Linux'
        run: sudo chown -R $(id -u):$(id -g) "${{ inputs.project-path }}/Library" 2>/dev/null || true

      # Save Library/ even on failure — it's complete before Gradle, so this warms the next run.
      - name: Save Library/ cache
        if: always() && steps.cache-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ inputs.project-path }}/Library
          key: ${{ steps.cache-library.outputs.cache-primary-key }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.platform }}-${{ inputs.config }}-${{ github.run_number }}
          path: ${{ inputs.project-path }}/Builds
          if-no-files-found: error
