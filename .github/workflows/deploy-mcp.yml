name: Deploy MCP

on:
  push:
    branches: [trunk]
    paths:
      - 'mcp-server/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote to prod: image tag to promote (e.g. sha-abc1234, or "dev" for latest dev)'
        type: string
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/daemon-tools-mcp

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase owner; github.repository_owner may not be.
      - name: Resolve image name
        id: image
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:dev
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}

  # Auto-deploy every dev image — skipped gracefully until the server secrets exist.
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    env:
      HAVE_SERVER: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Deploy dev
        if: env.HAVE_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/daemon-tools
            docker compose pull mcp-dev
            docker compose up -d mcp-dev
            docker image prune -f
      - name: No server configured
        if: env.HAVE_SERVER != 'true'
        run: echo "DEPLOY_HOST secret not set — image pushed, deploy skipped."

  promote-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.promote != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HAVE_SERVER: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        run: echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Promotion is retagging the exact bytes that ran on dev — never a rebuild.
      - name: Retag as prod
        run: docker buildx imagetools create -t ${{ steps.image.outputs.image }}:prod ${{ steps.image.outputs.image }}:${{ inputs.promote }}

      - name: Deploy prod
        if: env.HAVE_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/daemon-tools
            docker compose pull mcp
            docker compose up -d mcp
            docker image prune -f
