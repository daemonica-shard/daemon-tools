# The whole server is this folder: rsync it to the box, fill .env + config/, `docker compose up -d`.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Gates metrics ingest. `:?` because an *absent* value would expand to empty, and the
      # Caddy matcher would then admit anyone sending a bare `Authorization: Bearer ` — a
      # missing token must stop the stack, not quietly open the write path.
      OTEL_INGEST_TOKEN: ${OTEL_INGEST_TOKEN:?OTEL_INGEST_TOKEN is required, see .env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config

  mcp:
    image: ghcr.io/${GHCR_OWNER}/daemon-tools-mcp:prod
    restart: unless-stopped
    environment:
      # Both set = the Google-sign-in tier is on. Unset them for API-keys-only.
      OIDC_ISSUER: https://auth.${DOMAIN}/realms/${KC_REALM}
      PUBLIC_URL: https://mcp.${DOMAIN}
    volumes:
      - ./config/prod:/config:ro
      - mcp_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-dev:
    image: ghcr.io/${GHCR_OWNER}/daemon-tools-mcp:dev
    restart: unless-stopped
    environment:
      OIDC_ISSUER: https://auth.${DOMAIN}/realms/${KC_REALM}
      PUBLIC_URL: https://dev.mcp.${DOMAIN}
    volumes:
      - ./config/dev:/config:ro
      - mcp_dev_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Authorization server for the Google-sign-in tier. Keycloak federates login to Google
  # and issues the tokens our MCP servers verify; they never see Google directly.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Caddy terminates TLS, so Keycloak speaks plain HTTP behind it — but it must know
      # its public URL or it will mint redirect URIs pointing at the container.
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      # Selected per realm under Realm Settings → Themes → Login theme. Themes are cached in
      # production mode, so edits need a `docker compose restart keycloak` to appear.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Metrics store. Claude Code pushes OTLP straight in — no collector in between, since a
  # collector would only forward. Never published by Caddy except its OTLP write path.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # The whole point is history the transcripts no longer hold, so retain years, not days.
      - --storage.tsdb.retention.time=3y
      - --web.enable-otlp-receiver
      # Claude Code exports counters with delta temporality and ignores
      # OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=cumulative, so Prometheus' native OTLP
      # receiver drops every counter it sends ("invalid temporality and type combination") while
      # letting the non-counter metrics through — which looks like partial success. This converts
      # delta to cumulative on ingest instead of rejecting it. Experimental, and the conversion
      # state is in memory: a Prometheus restart shows up as a counter reset.
      - --enable-feature=otlp-deltatocumulative
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      # Login goes through the same Keycloak realm as the MCP servers, so who may see the
      # dashboards is decided in exactly one place.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Daemonica
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${DOMAIN}/realms/${KC_REALM}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${DOMAIN}/realms/${KC_REALM}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${DOMAIN}/realms/${KC_REALM}/protocol/openid-connect/userinfo
      # Keycloak already decided who is allowed in; a second allowlist here would just be a
      # place to forget to update.
      GF_USERS_ALLOW_SIGN_UP: "true"
      # Local admin login stays reachable on purpose: it is the way back in when an OIDC
      # misconfiguration locks everyone out, and Keycloak is a dependency that can be down.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  mcp_data:
  mcp_dev_data:
  keycloak_db:
  prometheus_data:
  grafana_data:
