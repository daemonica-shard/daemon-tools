apiVersion: 1

providers:
  # Dashboards are files in git, not database rows: editable: false means a change made in the
  # browser cannot survive a redeploy, which is the same "the server is one folder" property the
  # rest of this stack has.
  - name: daemon-tools
    folder: Daemon
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
